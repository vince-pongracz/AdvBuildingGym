[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adv-building-gym"
version = "0.1.0"
description = "A Gymnasium-compatible environment for controlling building heating systems based on KIT's LLEC."
authors = [
    { name = "Gökhan Demirel", email = "goekhan.demirel@kit.edu" },
    { name = "Vince Pongracz", email = "uchwd@student.kit.edu" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
# Core layer only (core/, components/, config/); the full pinned set is in requirements.txt.
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "PyYAML>=6.0",
]

[tool.setuptools]
packages = ["adv_building_gym"]
