trial_name: trial_1_sac_default
algorithm: sac
seed: 42
metric: episode_return_mean
checkpoint_frequency_episodes: 20
log_trajectories: false
num_envs: 1
grad_train: false

env_meta:
  EPISODE_LENGTH: 288
  control_step: 300
  allow_early_termination: false
  hst_env_wrapper:
    enabled: true
    hst_len: 288

training_params:
  common:
    learning_rate: 0.0003
    episode_lookback_horizon_steps: 120
    max_episodes_to_run: 3500
    clip_actions_to_env_bounds: true
  ppo:
    episodes_per_iteration: 10
    minibatch_size: 64
    num_epochs: 20
  sac:
    episodes_to_keep_in_replay_buffer: 500
    n_step_return: 6
    learning_starts_after_n_episodes: 50
  hst:
    offsets:
    - -1
    - -2
    - -3
    - -4
    - -6
    - -12
    - -18
    - -24
    - -36
    - -48
    - -60
    - -72
    - -84
    - -96
    - -108
    - -120
    - -132
    - -144
    tracked_keys:
    - s_battery_pct
    - s_ev_soc
    - s_temp_in_norm
    - s_temp_out_norm
    - s_solar_irradiance_norm
    - a_hp_prev
    - a_battery_prev

statesources:
- class: EnergyPriceDataSource
  name: E_price
  normalise: abs_min_max
- class: WeatherDataSource
  name: weather
  normalise: abs_min_max
- class: InsideTemperature
  name: desired_temp_in
- class: DesiredUserEnergyNeed
  name: user_energy_need
- class: BuildingHeatLoss
  name: building_heat_loss
  K: 20
  mC: 300
- class: EVState
  name: ev_schedule
- class: OperatorEnergyControl
  name: operator_energy_control
  max_power_kW: 20.0

infras:
- class: HP
  name: HP
  max_power_kW: 5.0
  cop_heat: 3.0
  cop_cool: 2.5
- class: BatteryTremblay
  name: battery
  max_power_kW: 19.0
  cell_capacity_Ah: 3.5
  max_charge_amps: 48.0
  max_charge_voltage: 420.0
  start_soc_percentage: 0.3
  max_charge_rate: 1.5
  history_length: 4
  E0: 3.2
  K: 0.009
  A: 0.468
  B: 3.529
  R_cell: 0.01
  n_series: 125
  n_parallel: 10
  charge_efficiency: 0.95
  discharge_efficiency: 0.95
  soc_min: 0.1
  soc_max: 0.95
- class: LinearEVCharger
  name: ev_charger
  max_power_kW: 7.0
  max_charging_kW: 7.0
  charger_efficiency: 0.92
  discharge_efficiency: 0.92
  v2g_enabled: true
  history_length: 4
  target_soc: 0.9
  max_charge_time_hrs: 24.0
  v2g_playroom: 0.1
- class: SolarPanel
  name: solar
  max_power_kW: 5.0
  pv_efficiency: 0.22
  panel_area_m2: 10
- class: WindTurbine
  name: wind_turbine
  max_power_kW: 5.0
  rated_power_kW: 5.0
  cut_in_speed: 3.0
  rated_speed: 12.0
  cut_out_speed: 25.0
- class: HouseholdEnergyConsumers
  name: hh_consumers
  peak_consumption_kW: 8.0

rewards:
- class_name: TempReward
  weight: 1.0
  params:
    zero_reward_diff_celsius: 1.0
    wrong_direction_penalty: -1.0
    terminate_diff_celsius: 3.5
    terminate_penalty: -100.0
- class_name: LongTermEconomicReward
  weight: 1.0
  params:
    reference_power_kW: 22.0
- class_name: MinimiseEnergyConsumptionReward
  weight: 1.0
  params:
    threshold_kWh: 0.5
- class_name: OperatorEnergyControlReward
  weight: 1.0
  params:
    harsh_penalty: -4.0
    soft_threshold_pct: 0.9
    recovery_steps: 3
    terminate_threshold_pct: 1.1
    terminate_penalty: -10
- class_name: BatteryTargetReward
  weight: 1.0
  params:
    min_pct: 0.15
    max_pct: 0.95
- class_name: BatteryMgmtReward
  weight: 1.0
  params:
    scale: 0.5
- class_name: EVChargingReward
  weight: 1.0
  params:
    diff_threshold: 0.02
    soc_diff_multiplier: 5.0
    disconnect_soc_tolerance: 0.05
    success_reward: 1.0
    failure_penalty: -10.0
    min_curve_violation_penalty: -10.0
- class_name: EVChargingOnTimeReward
  weight: 1.0
  params: {}

infra_schedule: null

statesource_schedule: null

reward_schedule: null

data_schedule:
  train: configs/schedules/data/train.yaml
  eval: configs/schedules/data/eval.yaml

