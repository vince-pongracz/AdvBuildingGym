# Example trial config — single source of truth for one training/eval run.
# Pass to run_train_ray.py / run_eval_ray.py via:
#     python run_train_ray.py --trial configs/trial_cfgs/trial_cfg_1.yaml

trial_name: trial_1_sac_random_reward_shifts

# --- algorithm & run control ---
algorithm: sac                 # ppo | sac
episodes: 3500                 # overrides training_params.max_episodes_to_run
seed: 42                       # overrides training_params.seed
metric: episode_return_mean    # reward_rate | achieved_reward | episode_return_mean
checkpoint_frequency_episodes: 20
log_trajectories: false
num_envs: 1
grad_train: false              # if true, the reward schedule mode is honoured;
                               # otherwise mode is forced to OFF (all rewards live)

# --- env topology (replaces the old configs/env/*.yaml wrapper) ---
env_meta:      configs/env_meta/default.yaml
infras:        configs/infra_cfgs/test1_mid.yaml
statesources:  configs/statesource_cfgs/default.yaml
rewards:       configs/reward_cfgs/rewards_all.yaml

# --- training params + schedules ---
training_params: configs/training_param_cfgs/default.yaml
data_schedule:   configs/schedules/data/train.yaml
reward_schedule: configs/schedules/reward/TL/random_train_1_3.yaml
infra_schedule:  null            # or configs/schedules/infra/train.yaml

# --- optional inline overrides (deep-merged onto referenced YAMLs) ---
# overrides:
#   training_params:
#     common: { learning_rate: 1.0e-4 }
#     ppo:    { minibatch_size: 128 }
