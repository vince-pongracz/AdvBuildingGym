trial_name: gen_lin_bat_pv_spec_sac
algorithm: sac
seed: 42
metric: episode_return_mean
log_trajectories: false
num_envs: 1
grad_train: false

env_meta:
  EPISODE_LENGTH: 288
  control_step: 300
  allow_early_termination: false
  hst_env_wrapper:
    enabled: true
    tracked_keys:
    - s_battery_soc
    - s_evc_soc
    - s_temp_error_norm
    - s_pv_power_norm
    - s_wind_power_norm
    offsets:
    - -1
    - -2
    - -3
    - -4

  forecast_env_wrapper:
    enabled: true
    forecast_steps: [1, 2, 3, 4, 5, 6, 12, 24, 36, 48]

training_params:
  common:
    evaluation:
      interval: 10
      duration: 10
    episode_lookback_horizon_steps: 120
    max_episodes_to_run: 7000
    clip_actions_to_env_bounds: true
    gamma: 0.99
  ppo:
    episodes_per_iteration: 10
    minibatch_size: 64
    num_epochs: 10
  sac:
    rollout_length: 144  # override: keep SAC at legacy half-episode fragment
    replay_batch_size: 256
    training_intensity: 10
    episodes_to_keep_in_replay_buffer: 500
    n_step_return: 3
    learning_starts_after_n_episodes: 50
  dreamerv3:
    rollout_length: 288
    training_ratio: 10.0
    episodes_to_keep_in_replay_buffer: 500
    batch_size_B: 16
    batch_length_T: 16
    horizon_H: 15

statesources:
- class: DateSource
  name: date
- class: EnergyPriceDayDynDataSource
  name: E_price
- class: WeatherDataSource
  name: weather
- class: DesiredUserEnergyNeed
  name: user_energy_need
  ctxt_keys: [ctxt_hh_consumption_max]
- class: OperatorEnergyControl
  name: operator_energy_control
  max_power_kW: 20.0

infras: null

rewards:
- class_name: EconomicRewardV0
  weight: 1.0

infra_schedule:
  mode: cycle
  swap_every_n_episodes: 12
  configs:
    train:
    - configs/infra_cfgs/GEN/battery_lin_cap_lin_pv_so/cfg_5.yaml
    eval:
    - configs/infra_cfgs/GEN/battery_lin_cap_lin_pv_so/cfg_eval_0.yaml
    - configs/infra_cfgs/GEN/battery_lin_cap_lin_pv_so/cfg_eval_1.yaml
    - configs/infra_cfgs/GEN/battery_lin_cap_lin_pv_so/cfg_eval_2.yaml
    - configs/infra_cfgs/GEN/battery_lin_cap_lin_pv_so/cfg_eval_3.yaml

statesource_schedule: null

reward_schedule: null

data_schedule:
  train: configs/schedules/data/train.yaml
  eval: configs/schedules/data/eval.yaml
