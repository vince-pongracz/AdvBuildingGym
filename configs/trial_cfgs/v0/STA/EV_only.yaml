trial_name: sta_EV_only
algorithm: sac
seed: 42
metric: episode_return_mean
log_trajectories: false
num_envs: 1
grad_train: false

env_meta:
  EPISODE_LENGTH: 288
  control_step: 300
  allow_early_termination: false
  hst_env_wrapper:
    enabled: true
    tracked_keys:
    - s_battery_soc
    - s_evc_soc
    - s_temp_error_norm
    - s_pv_power_norm
    - s_wind_power_norm
    offsets:
    - -1
    - -2
    - -3
    - -4

  forecast_env_wrapper:
    enabled: true
    forecast_steps: [1, 2, 3, 4, 5, 6, 12, 24, 36, 48]

training_params:
  common:
    evaluation:
      interval: 10
      duration: 10
    episode_lookback_horizon_steps: 120
    max_episodes_to_run: 7000
    clip_actions_to_env_bounds: true
    gamma: 0.99
  ppo:
    episodes_per_iteration: 10
    minibatch_size: 64
    num_epochs: 20
  sac:
    rollout_length: 144  # override: keep SAC at legacy half-episode fragment
    episodes_to_keep_in_replay_buffer: 500
    n_step_return: 3
    training_intensity: 32
    learning_starts_after_n_episodes: 50

statesources:
- class: DateSource
  name: date
- class: EnergyPriceDayDynDataSource
  name: E_price
- class: WeatherDataSource
  name: weather
- class: InsideTemperature
  name: desired_temp_in
- class: DesiredUserEnergyNeed
  name: user_energy_need
  ctxt_keys: [ctxt_hh_consumption_max]
- class: BuildingHeatLoss
  name: building_heat_loss
  K: 20
  mC: 300
- class: EVState
  name: ev_schedule
- class: OperatorEnergyControl
  name: operator_energy_control
  max_power_kW: 20.0

infras:
- class: LinearEVCharger
  name: ev_charger
  max_power_kW: 22.0
  v2g_enabled: true
  max_charge_time_hrs: 24.0
  v2g_playroom: 0.1
- class: SolarPanel
  name: solar
  max_power_kW: 5.0
  pv_efficiency: 0.22
  panel_area_m2: 50
- class: WindTurbine
  name: wind_turbine
  max_power_kW: 5.0
  cut_in_speed_ms: 3.0
  rated_speed_ms: 12.0
  cut_out_speed_ms: 25.0
- class: HouseholdEnergyConsumers
  name: hh_consumers
  peak_consumption_kW: 8.0

rewards:
- class_name: EVChargingRewardV0
  weight: 1.0
  params:
    diff_threshold: 0.02
    soc_diff_multiplier: 5.0
    disconnect_soc_tolerance: 0.05
- class_name: EVChargingOnTimeRewardV0
  weight: 1.0
  params: {}
- class_name: OperatorEnergyControlRewardV0
  weight: 0.1
  params:
    harsh_penalty: -2.0
    soft_threshold_pct: 0.9
    recovery_steps: 3
- class_name: ActionSmoothnessRewardV0
  weight: 1.0
  params:
    n_steps: 16
    mode: weighted
    freq_exponent: 1.0
infra_schedule: null

statesource_schedule: null

reward_schedule: null
data_schedule:
  train: configs/schedules/data/train.yaml
  eval: configs/schedules/data/eval.yaml

