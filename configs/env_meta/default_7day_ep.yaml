# Environment timing constants.
# Referenced by env wrapper YAMLs in configs/trial_cfgs/.
EPISODE_LENGTH: 2016       # 288 = one day at 5-min steps
# NOTE VP 2026.04.27. : Later longer eval runs possible
control_step: 300         # seconds
# When true, hard breaches (temp band, operator over-limit, EV failure)
# end the episode and emit the configured terminal penalty.  Set to false
# to keep episodes running through breaches with only the regular
# reward/penalty curves applied.
allow_early_termination: false
