
# Common hyperparameters (shared across all algorithms)
common:
  learning_rate: 3.0e-4
  seed: 42
  episode_lookback_horizon_steps: 120 # 5min steps, 12 steps = 1h --> 120 steps = 10h
  max_episodes_to_run: 7000
  clip_actions_to_env_bounds: True

# PPO-specific (on-policy)
ppo:
  episodes_per_iteration: 10
  minibatch_size: 64
  num_epochs: 20

# SAC-specific (off-policy)
sac:
  replay_batch_size: 512 # aka train_batch_size_per_learner
  training_intensity: 64
  # training_intensity (optional; default = "natural" = batch / (rollout_fragment * envs * runners))
  #
  # RLlib defines training_intensity as a *timestep* ratio:
  #     trained_timesteps / inserted_timesteps = training_intensity
  # The "UTD" of REDQ-style high-update-ratio papers is the gradient-step/env-step ratio:
  #     UTD_GE = training_intensity / replay_batch_size
  # Number of gradient updates per RLlib training iteration:
  #     grad_steps_per_iter = training_intensity * (rollout_fragment_length * num_env_runners * num_envs)
  #                            / replay_batch_size
  # If training_intensity is omitted, RLlib uses natural = 1 train batch per inserted batch.
  # Link: https://docs.ray.io/en/latest/_modules/ray/rllib/algorithms/sac/sac.html
  episodes_to_keep_in_replay_buffer: 365 # 1200
  n_step_return: 6
  learning_starts_after_n_episodes: 50 # Warm up replay buffer with 50 episodes before learning starts.

# Per-key strided history via StridedHistoryConnector.
# tracked_keys: observation-space keys (obs only). The Dict obs entry
# for each tracked key is replaced with a stacked tensor along the
# offsets. Offset 0 is prepended automatically so the current step is
# the first slice; offsets listed below are step lags (negative = past).
# Non-tracked keys pass through unchanged.
#
# For "previous action" history, list the ``<action_key>_prev`` obs
# entries published by the env (see building_adv.py:step) — these are
# plain obs keys and stack via the same uniform code path.
# Link: docs/hst_mgmt.md
hst:
  offsets: [-1, -2, -3, -4, -6, -12, -18, -24, -36, -48, -60, -72, -84, -96, -108, -120, -132, -144]
  # Time-varying observations worth stacking. Mirrors the ``s_*`` keys published
  # by statesources/infrastructure plus the ``a_*_prev`` keys from
  # building_adv.py. Static-per-episode targets (s_*_target_*) and quasi-static
  # setpoints (s_desired_temp_in_norm) are intentionally omitted — history
  # adds no signal when the value does not change within the episode.
  tracked_keys: 
    - s_battery_pct
    - s_ev_soc
    - s_temp_in_norm
    - s_temp_out_norm
    - s_solar_irradiance_norm
    - a_hp_prev
    - a_battery_prev
