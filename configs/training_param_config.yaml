
# Common hyperparameters (shared across all algorithms)
# TODO VP 2026.04.03. : At startup, when this config is loaded, log the config values to the console, so that we can easily track which config values are being used for training.
# TODO VP 2026.04.03. : Analyse the latest eval trajectories and maybe refactor the tempreward a bit.. 
common:
  # TODO VP 2026.04.03. : I guess the learning rate is not sufficient, or the alpha exploration param is not aggressive enough in the later stages of the training.
  learning_rate: 3.0e-4
  seed: 42
  episode_lookback_horizon_steps: 120 # 5min steps, 12 steps = 1h --> 120 steps = 10h
  max_episodes_to_run: 7000

# PPO-specific (on-policy)
ppo:
  episodes_per_iteration: 10
  minibatch_size: 64
  num_epochs: 20

# SAC-specific (off-policy)
sac:
  replay_batch_size: 128
  days_to_keep_in_replay_buffer: 1500
  training_intensity: 64
  rollout_fragment_length: 64
