# Infrastructure schedule configuration
# Controls which env config YAML is active during training.
# Only the "infras" and "building_props" sections are used from each config.
#
mode: cycle                    # "cycle" = round-robin through configs, "off" = disabled
swap_every_n_iterations: 300   # hold each config for N training iterations

# Ordered list of env config YAML files to cycle through.
# NOTE: the existing small/mid/large configs change multiple infras
# simultaneously (battery, EV, solar all differ).  Intermediate YAML
# files should be created to satisfy the one-change-at-a-time constraint.
configs:
  - configs/env_gen_solar_power/env_solar_1.yaml
  - configs/env_gen_solar_power/env_solar_2.yaml
  - configs/env_gen_solar_power/env_solar_3.yaml
  - configs/env_gen_solar_power/env_solar_4.yaml
  - configs/env_gen_solar_power/env_solar_5.yaml