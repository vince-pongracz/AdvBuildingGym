# Variant statesource bundle with min_max normalisation on user_energy_need.
statesources:
- class: EnergyPriceDataSource
  name: E_price
  normalise: abs_min_max
- class: WeatherDataSource
  name: weather
  normalise: abs_min_max
- class: InsideTemperature
  name: desired_temp_in
- class: DesiredUserEnergyNeed
  name: user_energy_need
  normalise: min_max
- class: BuildingHeatLoss
  name: building_heat_loss
  K: 20      # heat transfer coefficient [W/K]
  mC: 300    # thermal mass × heat capacity [J/K]
- class: EVState
  name: ev_schedule
