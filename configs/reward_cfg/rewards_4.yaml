# Reward function definitions shared across training and evaluation.
# Each entry must match a registered RewardFunction class name.

rewards:
  # - class_name: TempReward
  #   weight: 1.0
  #   params:
  #     zero_reward_diff_celsius: 1.0
  #     wrong_direction_penalty: -1.0

  - class_name: EconomicReward
    weight: 0.1
    params:
      reference_power_kW: 15.0
      export_bonus: 3.0

  - class_name: LongTermEconomicReward
    weight: 0.9
    params:
      reference_power_kW: 15.0
      export_bonus: 3.0

  # - class_name: MinimiseEnergyConsumptionReward
  #   weight: 0.2
  #   params: {}

  - class_name: OperatorEnergyControlReward
    weight: 1.0
    params:
      max_power_kW: 15.0
      harsh_penalty: -2.0
      soft_threshold_pct: 0.9
      recovery_steps: 3

  - class_name: BatteryTargetReward
    weight: 1.0
    params:
      min_pct: 0.15
      max_pct: 0.85
      in_band_reward: 0.3
      max_penalty: -3.0

  # - class_name: EVChargingReward
  #   weight: 1.0
  #   params:
  #     diff_threshold: 0.02
  #     soc_diff_multiplier: 5.0

  # - class_name: EVChargingOnTimeReward
  #   weight: 1.0
  #   params: {}

  - class_name: ActionSmoothnessReward
    weight: 0.5
    params: {}
