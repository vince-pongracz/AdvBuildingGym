# See README.md in this directory for field documentation.
# TODO VP 2026.04.23. : Check why 'sun_shine' column is missing and falls back to 'direct_sun_shine' in WeatherDataSource.

rewards_file: rewards.yaml

mode: "random"
swap_every_n_iterations: 100
seed: 42

# RANDOM-mode tuning: keep `random_active_count` rewards active at all times
# and rotate `random_swap_count` of them on each swap cycle.
random_active_count: 3
random_swap_count: 1

# Dynamic-callback exploration kick on every reward set change.
# See README.md (configs/reward_cfg/) for field semantics.
exploration_bump:
  enabled: true
  ppo_entropy_coeff: 0.05
  ppo_entropy_baseline: 0.0
  sac_alpha: 0.5
  decay_iterations: 50    # half of swap_every_n_iterations
  lr_multiplier: 1.5
