# Per-episode size sampling for BOTH the battery and the PV array:
# - BatteryLinearWrapper: capacity drawn uniformly from max_cap_range_kWh at every
#   reset, rounded to 1 decimal; exc_max_cap_kWh holds out the in-range eval
#   capacities (12/16, see battery_lin_cap_lin_pv_so/cfg_eval_*.yaml).
# - SolarPanelWrapper: STC rating drawn from max_power_range_kW the same way;
#   exc_max_power_kW holds out the eval ratings (6/12). panel_area_m2 is derived
#   per draw as rating * 0.975 / 0.22 (≈ -2.5 % headroom below the clip).
infras:
- class: BatteryLinearWrapper
  name: battery
  ctxt_keys: [ctxt_battery_capacity_kWh]
  max_power_range_kW: [10.0, 10.0]
  max_cap_range_kWh: [10.0, 20.0]
  exc_max_cap_kWh: [12.0, 16.0]
  start_soc_percentage: 0.3
  start_soc_jitter: 0.1
  soc_min: 0.1
  soc_max: 0.95
- class: SolarPanelWrapper
  name: solar
  ctxt_keys: [ctxt_solar_max_power_kW]
  max_power_range_kW: [5.0, 15.0]
  exc_max_power_kW: [6.0, 12.0]
  pv_efficiency: 0.22
- class: WindTurbine
  name: wind_turbine
  max_power_kW: 5.0
  cut_in_speed_ms: 3.0
  rated_speed_ms: 12.0
  cut_out_speed_ms: 25.0
- class: HouseholdEnergyConsumers
  name: hh_consumers
  peak_consumption_kW: 8.0
