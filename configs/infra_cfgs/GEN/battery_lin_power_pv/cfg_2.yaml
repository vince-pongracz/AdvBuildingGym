# Battery max power 3.0 kW (capacity pinned 10 kWh), PV rating 10.0 kW.
infras:
- class: BatteryLinear
  name: battery
  ctxt_keys: [ctxt_battery_power_kW]
  max_power_kW: 3.0
  max_cap_kWh: 10.0
  start_soc_percentage: 0.3
  start_soc_jitter: 0.1
  soc_min: 0.1
  soc_max: 0.95
- class: SolarPanel
  name: solar
  ctxt_keys: [ctxt_solar_max_power_kW]
  max_power_kW: 10.0
  pv_efficiency: 0.22
- class: WindTurbine
  name: wind_turbine
  max_power_kW: 5.0
  cut_in_speed_ms: 3.0
  rated_speed_ms: 12.0
  cut_out_speed_ms: 25.0
- class: HouseholdEnergyConsumers
  name: hh_consumers
  peak_consumption_kW: 8.0
# Rule-based HP + EV charger: plain consumers, no policy action (see hp_rbc.py / evcs_rbc.py).
- class: HPRbc
  name: HP
  max_power_kW: 1.0
  cop_heat: 3.0
  cop_cool: 2.5
  deadband_C: 0.5
  action_noise_std: 0.05
- class: EvcsRbc
  name: ev_charger
  max_power_kW: 22.0
  max_charge_time_hrs: 24.0
  action_noise_std: 0.05
