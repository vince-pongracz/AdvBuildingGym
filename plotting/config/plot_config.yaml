# Domain-specific plotting configuration.
#
# Extend this file when adding new state sources, infrastructure, or actions
# instead of editing Python plot modules.

states:
  # State keys excluded from plotting (constants or non-informative values)
  skip_keys:
    - E_price_max
    - sim_hour
    - _temp_abs_max

  # Groups of state keys that share a single plot.
  # Each entry is a list of keys rendered together.
  grouped_keys:
    - [battery_pct, battery_target_pct]
    - [temp_in_norm, desired_temp_in_norm, temp_out_norm]
    - [ev_schedule_charger_eff, ev_schedule_discharge_eff]
    - [ev_schedule_start_soc, ev_schedule_target_soc]
    - [ev_soc, ev_target_soc]

  # Keys masked with NaN when a condition key is below 0.5.
  # Produces non-continuous lines (gaps) when the device is disconnected.
  mask_when_disconnected:
    condition_key: ev_connected
    keys:
      - ev_soc
      - ev_target_soc
      - ev_soc_hist
      - ev_charge_to_target_hrs_norm


actions:
  # Human-readable dimension labels for multi-dimensional actions.
  # Keys that are not listed here fall back to numeric indices (0, 1, …).
  dim_labels: {}

raw:
  # Group temperature raw values into a single plot (same unit: °C)
  grouped_keys:
    - [temp_out_raw, temp_in_raw, desired_temp_in_raw]

  # Raw keys to skip in plotting
  skip_keys:
    - E_price_max_raw  # constant per episode, not useful as time series

output:
  # Relative to repository root
  dir: plotting/out/traj_plots
