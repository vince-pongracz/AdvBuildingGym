# Weak synthetic-data preset.
# Same Gaussian noise as syn_cfg_2 / syn_cfg_3; mild negative shifts
# (slightly cooler weather, slightly cheaper electricity).
# Noise is moving-average smoothed over 6 samples (= 30 min at 5-min step)
# to suppress high-frequency oscillations.

name: syn_cfg_1

price:
  baseprice:
    transforms:
      - {type: constant_shift, value: -0.5}                                            # ct/kWh
      - {type: gaussian_noise, std: 0.3, smooth: {kind: moving_average, window: 6}}   # ct/kWh

weather:
  temp_amb:
    transforms:
      - {type: constant_shift, value: -0.3}                                            # °C
      - {type: gaussian_noise, std: 0.5, smooth: {kind: moving_average, window: 6}}   # °C
    clip: {min: -50.0, max: 60.0}
  avg_wind_speed:
    transforms:
      - {type: constant_shift, value: -0.1}      
      - {type: gaussian_noise, std: 0.3, smooth: {kind: moving_average, window: 6}}   # m/s
    clip: {min: 0.0}
  sun_shine:
    transforms:
      - {type: gaussian_noise, std: 5.0, smooth: {kind: moving_average, window: 6}}   # J/cm²
    clip: {min: 0.0}
  direct_sun_shine:
    transforms:
      - {type: gaussian_noise, std: 3.0, smooth: {kind: moving_average, window: 6}}
    clip: {min: 0.0}
  diff_sun_shine:
    transforms:
      - {type: gaussian_noise, std: 2.0, smooth: {kind: moving_average, window: 6}}
    clip: {min: 0.0}
