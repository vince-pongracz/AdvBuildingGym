# Augmentation noise configuration for preproc/augment.py
#
# Each domain section defines which columns to augment, the noise standard
# deviation per column, and optional lower-bound clipping to keep values
# physically plausible.

# TODO VP 2026.04.23. : add more data augmentation configs, 
# different augmentation strengths are needed.

seed: 42

price:
  columns:
    - baseprice
  noise_std:
    baseprice: 0.3          # ct/kWh

weather:
  columns:
    - temp_amb
    - avg_wind_speed
    - sun_shine
    - direct_sun_shine
    - diff_sun_shine
  # TODO VP 2026.03.10. : Tune these values based on DWD sensor measurement
  # uncertainty and desired augmentation strength. Current values are rough
  # initial guesses scaled to each variable's typical magnitude.
  noise_std:
    temp_amb: 0.5           # °C
    avg_wind_speed: 0.3     # m/s
    sun_shine: 5.0          # J/cm²
    direct_sun_shine: 3.0   # J/cm²
    diff_sun_shine: 2.0     # J/cm²
  clip_min:
    avg_wind_speed: 0.0
    sun_shine: 0.0
    direct_sun_shine: 0.0
    diff_sun_shine: 0.0
    rel_humidity: 0.0
